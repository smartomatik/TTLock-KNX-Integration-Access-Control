# Node-RED + Cloudflare Tunnel dla integracji TTLock → KNX
# Uruchomienie (Linux):
#   mkdir -p data && sudo chown 1000:1000 data
#   cp .env.example .env   # wpisz TUNNEL_TOKEN z panelu Cloudflare (tylko wariant 13A)
#   docker compose up -d                 # Node-RED + Cloudflare Tunnel
#   docker compose up -d node-red        # sam Node-RED (warianty 13B / 13C)
# Utrzymanie: patrz docs/UTRZYMANIE.md

x-logi: &logi                   # ograniczenie logów – bez tego po latach mogą zapełnić dysk
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  node-red:
    image: nodered/node-red:5.0.7   # wersja przypięta = przewidywalne działanie; aktualizuj świadomie
    container_name: node-red
    restart: unless-stopped
    network_mode: host              # KNX IP (UDP) działa najpewniej w sieci hosta; edytor na porcie 1880
    environment:
      - TZ=Europe/Warsaw
    volumes:
      - ./data:/data                # flow, ustawienia (settings.js), węzły, dane logowania – KOPIA ZAPASOWA!
    logging: *logi
    # Obraz Node-RED ma wbudowany healthcheck – "docker ps" pokazuje (healthy).

  cloudflared:
    # "latest" celowo: Cloudflare wspiera wersje cloudflared do ok. roku od najnowszego wydania,
    # przypięta wersja po kilku latach może przestać działać. Aktualizacja: docs/UTRZYMANIE.md
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    network_mode: host              # dostęp do localhost:1880
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    logging: *logi
