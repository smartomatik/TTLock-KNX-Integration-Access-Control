# Node-RED + Cloudflare Tunnel dla integracji TTLock → KNX
# Uruchomienie (Linux):
#   mkdir -p data && sudo chown 1000:1000 data
#   cp .env.example .env   # wpisz TUNNEL_TOKEN z panelu Cloudflare
#   docker compose up -d
services:
  node-red:
    image: nodered/node-red:5.0.7
    container_name: node-red
    restart: unless-stopped
    network_mode: host          # KNX IP (UDP) działa najpewniej w sieci hosta; edytor na porcie 1880
    environment:
      - TZ=Europe/Warsaw
    volumes:
      - ./data:/data            # flow, ustawienia (settings.js), zainstalowane węzły, keyring KNX

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    container_name: cloudflared
    restart: unless-stopped
    network_mode: host          # dostęp do localhost:1880
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
